name: Python tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio aiohttp httpx pydantic pydantic-settings
      - name: Compile Python sources
        run: python -m compileall -q core tools tests
      - name: Run OSIRIS regression tests
        run: python -m pytest -q tests/test_osiris_tools.py
